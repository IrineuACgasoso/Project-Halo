# Linter do projeto (roteiro A4): só as regras F do pyflakes (nome indefinido, import não usado,
# import *, variável não usada). Rodar: .venv\Scripts\python.exe -m ruff check
# .venv/, build/ e dist/ já ficam de fora pela exclusão padrão do ruff.
[lint]
select = ["F"]

# Exceções: as violações que já existiam na A4 (arquivo -> regras). A lista SÓ PODE ENCOLHER:
#  - arquivo novo ou regra nova num arquivo não entra aqui; corrija o código;
#  - ao corrigir um arquivo, apague a entrada (tests/unit/test_lint.py falha com entrada que sobrou).
[lint.per-file-ignores]
